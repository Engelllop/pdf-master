<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px;
      height: 240px;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e2e8f0;
      overflow: hidden;
      border-radius: 12px;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #1e293b;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <svg class="icon" viewBox="0 0 100 100" fill="none">
    <rect x="15" y="10" width="70" height="80" rx="8" fill="white"/>
    <path d="M70 10 L85 25 L85 90 L15 90 L15 10 Z" fill="none"/>
    <polygon points="70,10 85,10 85,25" fill="#e2e8f0"/>
    <text x="50" y="58" text-anchor="middle" font-size="32" font-weight="bold" fill="#3b82f6" font-family="sans-serif">P</text>
    <text x="50" y="78" text-anchor="middle" font-size="10" fill="#64748b" font-family="sans-serif">PDF</text>
  </svg>
  <div class="title">PDF Master</div>
  <div class="subtitle">Iniciando motor PDF...</div>
  <div class="spinner"></div>
</body>
</html>

name: Seguridad

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

# El CI probaba que la app funciona, no que sea segura de instalar: nadie miraba las
# dependencias ni el codigo con analisis estatico. Corre en cada PR a main y una vez
# por semana (una CVE nueva no espera a que alguien toque el repo).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # El arbol entero, no solo lo que viaja en el instalador: el toolchain de
      # build tambien firma y empaqueta. Se limpio a cero antes de poner esto, asi
      # que un fallo aqui es una CVE nueva, no deuda heredada que se acaba ignorando.
      # `--audit-level=high` dejaba pasar las moderate sin decir nada, y ahi hay
      # cosas reales (un path traversal en @vitest/mocker vivio semanas en verde).
      # Se limpio a cero antes de bajar el umbral, asi que un fallo aqui es una CVE
      # nueva, no deuda heredada que se acaba ignorando.
      - name: npm audit
        run: npm audit --audit-level=moderate
        working-directory: frontend
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: pip-audit del motor
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
